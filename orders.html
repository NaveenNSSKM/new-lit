<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders | AURA</title>
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>

  <!-- Header is injected by js/main.js -->

  <main class="container section-padding" style="margin-top: 4.5rem;">
    <!-- Authorization Required Banner (guest view) -->
    <div id="orders-lock-screen" style="display:none; text-align:center; padding: 5rem 0;">
      <svg width="40" height="40" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="color:var(--text-tertiary); margin-bottom:1.5rem;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
      <h2 style="font-size: 1.5rem; text-transform: uppercase; letter-spacing:0.05em; margin-bottom: 1rem;">Authentication Required</h2>
      <p style="font-size: 0.938rem; color: var(--text-secondary); margin-bottom: 2rem;">Please sign in to view your orders timeline and receipts.</p>
      <button class="btn btn-primary" id="lock-orders-login-btn">Log In Now</button>
    </div>

    <!-- Active Profile Dashboard -->
    <div class="profile-layout" id="orders-dashboard-content">
      
      <!-- Left: Sidebar navigation -->
      <aside class="profile-sidebar" aria-label="Account Menu">
        <div class="profile-avatar-block">
          <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?q=80&w=150&auto=format&fit=crop" alt="Profile" class="profile-avatar-large" id="orders-avatar-large">
          <span style="font-size:0.875rem; font-weight:600; display:block; margin-top:1rem;" id="orders-user-name">Valued Customer</span>
        </div>

        <nav class="profile-nav-menu">
          <a href="profile.html" class="profile-nav-btn">
            <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            Personal Details
          </a>
          <a href="orders.html" class="profile-nav-btn active">
            <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
            My Orders
          </a>
          <button class="profile-nav-btn" id="orders-logout-sidebar-btn" style="width:100%; border:none; background:none;">
            <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
            Logout
          </button>
        </nav>
      </aside>

      <!-- Right: Main edit fields container -->
      <section style="flex-grow:1;" aria-label="Purchase History">
        <h2 style="font-size: 1.25rem; text-transform: uppercase; letter-spacing:0.05em; margin-bottom: 2rem; border-bottom:1px solid var(--border-color); padding-bottom:1rem;">Your Order History</h2>
        
        <div id="orders-list-container">
          <!-- Dynamically populated or Skeletons -->
          <div class="skeleton-card" style="height: 10rem; margin-bottom: 1.5rem;"></div>
          <div class="skeleton-card" style="height: 10rem;"></div>
        </div>
      </section>

    </div>
  </main>

  <!-- Supabase Script -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- App scripts -->
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/main.js"></script>
  <script src="js/orders.js"></script>
</body>
</html>
