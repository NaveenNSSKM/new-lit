<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details | AURA</title>
  <meta name="description" content="View product specifications, available sizes, colors, pricing, and buyer reviews for this premium AURA fashion item.">
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>

  <!-- Layout Header injected by js/main.js -->

  <main class="container section-padding" style="margin-top: 4.5rem;">
    <!-- Breadcrumb -->
    <nav aria-label="Breadcrumb" style="margin-bottom: 2rem; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-tertiary);">
      <a href="index.html" style="color:var(--text-secondary)">Home</a> / 
      <a href="shop.html" style="color:var(--text-secondary)">Shop</a> / 
      <span id="breadcrumb-active" style="color:var(--text-primary)">Product</span>
    </nav>

    <!-- Product Grid -->
    <div class="product-details-grid" id="product-details-container">
      <!-- Image Gallery Skeleton -->
      <div class="product-gallery">
        <div class="main-image-viewport skeleton"></div>
        <div class="gallery-thumbs">
          <div class="skeleton" style="aspect-ratio:3/4;"></div>
          <div class="skeleton" style="aspect-ratio:3/4;"></div>
          <div class="skeleton" style="aspect-ratio:3/4;"></div>
        </div>
      </div>
      
      <!-- Info Skeleton -->
      <div>
        <div class="skeleton-category skeleton" style="width: 20%; height: 1rem; margin-bottom: 1.5rem;"></div>
        <div class="skeleton-title skeleton" style="width: 70%; height: 2.5rem; margin-bottom: 1rem;"></div>
        <div class="skeleton-price skeleton" style="width: 30%; height: 1.75rem; margin-bottom: 2.5rem;"></div>
        <div class="skeleton" style="width: 100%; height: 12rem;"></div>
      </div>
    </div>

    <!-- Related Products -->
    <section class="section-padding" style="border-top:1px solid var(--border-color); margin-top:5rem;" aria-label="Related Products">
      <h2 style="font-size: 1.25rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 2.5rem;">You May Also Like</h2>
      <div class="products-grid" id="related-products-grid">
        <!-- Loader Skeletons -->
        <div class="skeleton-card">
          <div class="skeleton-image skeleton"></div>
          <div class="skeleton-info"><div class="skeleton-category skeleton"></div><div class="skeleton-title skeleton"></div><div class="skeleton-price skeleton"></div></div>
        </div>
        <div class="skeleton-card">
          <div class="skeleton-image skeleton"></div>
          <div class="skeleton-info"><div class="skeleton-category skeleton"></div><div class="skeleton-title skeleton"></div><div class="skeleton-price skeleton"></div></div>
        </div>
        <div class="skeleton-card">
          <div class="skeleton-image skeleton"></div>
          <div class="skeleton-info"><div class="skeleton-category skeleton"></div><div class="skeleton-title skeleton"></div><div class="skeleton-price skeleton"></div></div>
        </div>
      </div>
    </section>

    <!-- Reviews Section -->
    <section class="reviews-section" aria-label="Customer Reviews">
      <h2 style="font-size: 1.25rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 2.5rem;">Customer Reviews</h2>
      
      <div class="reviews-grid">
        <!-- Left: Summary Stats & Write Review -->
        <div>
          <div class="reviews-summary-card">
            <div class="summary-rating-number" id="avg-rating-num">0.0</div>
            <div class="summary-stars" id="avg-rating-stars">
              <!-- Render stars -->
            </div>
            <p style="font-size:0.813rem; color:var(--text-secondary);" id="total-reviews-count">Based on 0 reviews</p>
          </div>

          <!-- Add Review Form -->
          <div style="margin-top: 2.5rem; padding: 1.5rem; border: 1px solid var(--border-color); border-radius: var(--border-radius-sm);">
            <h3 style="font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 1.5rem;">Share Your Experience</h3>
            <form id="add-review-form">
              <div class="form-group">
                <label class="form-label" for="review-name">Name</label>
                <input type="text" id="review-name" required class="form-input" placeholder="Alex M.">
              </div>
              <div class="form-group">
                <label class="form-label" for="review-rating">Rating</label>
                <select id="review-rating" class="form-select">
                  <option value="5">5 Stars (Excellent)</option>
                  <option value="4">4 Stars (Good)</option>
                  <option value="3">3 Stars (Average)</option>
                  <option value="2">2 Stars (Poor)</option>
                  <option value="1">1 Star (Very Bad)</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label" for="review-comment">Review Description</label>
                <textarea id="review-comment" rows="4" required class="form-input" placeholder="Fabric weight, stitch quality, sizing recommendations..." style="resize:none;"></textarea>
              </div>
              <button type="submit" class="btn btn-primary" style="width:100%;">Submit Review</button>
            </form>
          </div>
        </div>

        <!-- Right: Reviews List -->
        <div class="review-list" id="reviews-list-container">
          <!-- Filled Dynamically -->
          <p style="color:var(--text-secondary)">No reviews yet for this product. Be the first to write one!</p>
        </div>
      </div>
    </section>
  </main>

  <!-- Supabase CDN Script -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Core script integrations -->
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/main.js"></script>
  
  <!-- Page Specific Logic -->
  <script src="js/product-details.js"></script>
</body>
</html>
