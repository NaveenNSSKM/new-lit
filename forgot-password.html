<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | AURA</title>
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>

  <!-- Header is injected by js/main.js -->

  <main class="container section-padding" style="margin-top: 4.5rem; display: flex; align-items: center; justify-content: center; min-height: 75vh;">
    
    <div class="checkout-card" style="width: 100%; max-width: 400px; padding: 2.5rem;">
      <h1 style="font-size: 1.5rem; font-weight: 300; text-transform: uppercase; letter-spacing: 0.15em; text-align: center; margin-bottom: 1rem;">Reset Password</h1>
      <p style="font-size: 0.813rem; text-align: center; color: var(--text-secondary); margin-bottom: 2rem;">Enter the email address associated with your AURA account, and we will dispatch a password recovery link.</p>
      
      <form id="forgot-password-form">
        <div class="form-group">
          <label class="form-label" for="reset-email">Email Address</label>
          <input type="email" id="reset-email" required class="form-input" placeholder="name@domain.com">
        </div>
        
        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:1.5rem;">Send Recovery Link</button>
        
        <p style="text-align:center; font-size:0.813rem; margin-top:1.5rem; color:var(--text-secondary);">
          Remember your details? <a href="index.html" class="auth-trigger" id="reset-back-btn" style="color:var(--text-primary); font-weight:500;">Sign In</a>
        </p>
      </form>
    </div>

  </main>

  <!-- Supabase Script -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- App scripts -->
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/main.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById('reset-back-btn')?.addEventListener('click', (e) => {
        // If we are redirecting to index.html, we can trigger the login modal.
        // For standard fallback, let it redirect.
      });

      document.getElementById('forgot-password-form')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('reset-email').value.trim();

        // Check if we are running in Supabase mode
        const isDemo = window.FASHION_CONFIG.isDemoMode();
        
        if (!isDemo && window.supabase) {
          try {
            const supabase = window.supabase.createClient(
              window.FASHION_CONFIG.SUPABASE_URL,
              window.FASHION_CONFIG.SUPABASE_ANON_KEY
            );
            const { error } = await supabase.auth.resetPasswordForEmail(email, {
              redirectTo: window.location.origin + '/profile.html',
            });
            if (error) {
              window.showToast(error.message, "danger");
            } else {
              window.showToast("Recovery email dispatched. Please check your inbox.");
              e.target.reset();
            }
          } catch (err) {
            window.showToast("Password reset request failed.", "danger");
          }
        } else {
          // Demo simulation
          window.showToast("Demo Mode: Password reset link simulated for: " + email);
          e.target.reset();
        }
      });
    });
  </script>
</body>
</html>
